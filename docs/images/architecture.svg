<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="50%" y="32" fill="#cbd5e1" font-size="18" text-anchor="middle">SecureCode System Architecture</text>
  <g fill="#0ea5a4" font-family="Arial" font-size="14">
    <rect x="40" y="70" width="160" height="40" rx="6" fill="#111827" stroke="#0ea5a4"/>
    <text x="120" y="95" text-anchor="middle">Browser</text>

    <rect x="230" y="50" width="200" height="80" rx="8" fill="#111827" stroke="#0ea5a4"/>
    <text x="330" y="80" text-anchor="middle">Next.js Frontend</text>

    <rect x="470" y="50" width="180" height="80" rx="8" fill="#111827" stroke="#0ea5a4"/>
    <text x="560" y="80" text-anchor="middle">API / FastAPI Backend</text>

    <rect x="680" y="40" width="200" height="100" rx="8" fill="#111827" stroke="#0ea5a4"/>
    <text x="780" y="75" text-anchor="middle">Scanners & AI Layer</text>
    <text x="780" y="95" text-anchor="middle" font-size="12">(semgrep, secret_scanner, AI explainer)</text>

    <line x1="200" y1="90" x2="230" y2="90" stroke="#0ea5a4" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="430" y1="90" x2="470" y2="90" stroke="#0ea5a4" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="650" y1="90" x2="680" y2="90" stroke="#0ea5a4" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#0ea5a4" />
    </marker>
  </defs>
</svg>